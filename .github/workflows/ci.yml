name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lint
        run: |
          chmod +x scripts/lint.sh app/app.sh
          ./scripts/lint.sh

  test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          chmod +x app/app.sh tests/test.sh
          ./tests/test.sh

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test Docker image
        run: |
          chmod +x scripts/build.sh app/app.sh
          ./scripts/build.sh
